name: Build and Release Pygame

# Triggers when a version tag like "v1.0.5" is pushed, or via manual dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Grants the workflow permission to create the Release page
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # ubuntu-22.04 is used for maximum backward compatibility on Linux
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Change to your preferred Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: bash
        # NOTE: If you don't have an "assets" folder, remove the --add-data flags below!
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pyinstaller --onefile --windowed --add-data "assets;assets" --name Triggered triggered.py
          else
            pyinstaller --onefile --windowed --add-data "assets:assets" --name Triggered triggered.py
          fi

      - name: Package Releases (Preserve Permissions & Rename)
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" == "Linux" ]; then
            # Make executable, compress to lock permissions, then delete raw file
            chmod +x Triggered
            tar -czvf Triggered-${{ matrix.os }}.tar.gz Triggered
            rm Triggered 
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Zip the Mac bundle, then delete raw .app folder
            zip -r Triggered-${{ matrix.os }}.zip Triggered.app
            rm -rf Triggered.app
          elif [ "$RUNNER_OS" == "Windows" ]; then
            # Rename Windows executable for clarity on the Release page
            mv Triggered.exe Triggered-${{ matrix.os }}.exe
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Triggered-${{ matrix.os }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    # Double-check that this step only runs for tagged releases
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
