name: Build and Release Pygame

# Triggers when a version tag like "v1.1.0" is pushed, or via manual dispatch
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Grants the workflow permission to create the Release page
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Using modern runners, but forcing backward compatibility in the steps below
        os: [ubuntu-22.04, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' 
          architecture: 'x64' # CRITICAL: Forces Intel Python on M-series Mac runners

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build executable with PyInstaller
        shell: bash
        env:
          # Forces the modern macOS compiler to target Monterey libraries
          MACOSX_DEPLOYMENT_TARGET: "12.0" 
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            pyinstaller --onefile --windowed --add-data "assets;assets" --name Triggered triggered.py
          else
            pyinstaller --onefile --windowed --add-data "assets:assets" --name Triggered triggered.py
          fi

      - name: Package Releases (Preserve Permissions, Rename & Add Version)
        shell: bash
        run: |
          cd dist
          # Dynamically grab the tag you just pushed (e.g., v1.1.0)
          VERSION=${{ github.ref_name }}
          
          if [ "$RUNNER_OS" == "Linux" ]; then
            # Make executable, compress to lock permissions, then delete raw file
            chmod +x Triggered
            tar -czvf Triggered-$VERSION-${{ matrix.os }}.tar.gz Triggered
            rm Triggered 
          elif [ "$RUNNER_OS" == "macOS" ]; then
            # Zip the Mac bundle, then delete raw .app folder
            zip -r Triggered-$VERSION-${{ matrix.os }}.zip Triggered.app
            rm -rf Triggered.app
          elif [ "$RUNNER_OS" == "Windows" ]; then
            # Rename Windows executable for clarity on the Release page
            mv Triggered.exe Triggered-$VERSION-${{ matrix.os }}.exe
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Triggered-${{ matrix.os }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}